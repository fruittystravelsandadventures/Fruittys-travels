<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Trip – Fruitty’s Travel &amp; Adventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#4a5a2b; --olive-dark:#2f3a1a; --gold:#c8a24a; --blue:#1f4fb4;
  --white:#ffffff; --ground:#eef1e6; --ink:#1d2314; --muted:#5d664d; --line:#d5dbc5;
  --head:"Bricolage Grotesque", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --ground:#171b10; --white:#232a17; --ink:#f0f3e6; --muted:#b3bba0; --line:#3a4426; --olive:#a9bd78; --olive-dark:#d9e6b3; --blue:#7fa6ff; }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding:max(20px,env(safe-area-inset-top,0px)) 16px max(32px,env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--olive-dark);font-family:var(--head);font-weight:700;font-size:1.05rem}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--gold);display:inline-block}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:26px}
.lookup h1{font-size:1.9rem;color:var(--olive-dark);margin-bottom:8px}
.lookup p{color:var(--muted);margin:0 0 20px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-block;font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;border:0;border-radius:10px;padding:13px 20px;background:var(--olive);color:#fff;margin-top:20px}
.btn.pay{background:var(--blue);width:100%;font-size:1.05rem;margin-top:16px}
.btn.ghost{background:transparent;color:var(--olive-dark);border:1px solid var(--line);margin-top:0}
.error{margin-top:14px;color:#a3281d;font-weight:500}
@media (prefers-color-scheme: dark){.error{color:#ff9d92}}
.hidden{display:none}

/* trip card: top section + torn-off balance stub */
.pass{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pass-top{padding:26px;border-top:8px solid var(--olive)}
.pass-top .hello{color:var(--muted);margin:0 0 4px}
.pass-top h1{font-size:2rem;color:var(--olive-dark)}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;color:var(--muted);font-size:.95rem}
.meta b{color:var(--ink);font-weight:600}
.tear{position:relative;height:0;border-top:2px dashed var(--line);margin:0 22px}
.tear::before,.tear::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--ground);border:1px solid var(--line)}
.tear::before{left:-35px}.tear::after{right:-35px}
.stub{padding:24px 26px 28px}
.bal-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.bal-row .label{color:var(--muted);font-size:.92rem}
.bal-row .amount{font-family:var(--head);font-weight:700;font-size:2.4rem;line-height:1;color:var(--olive-dark)}
.bar{height:10px;background:var(--line);border-radius:6px;margin:16px 0 8px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold);border-radius:6px}
.small{color:var(--muted);font-size:.9rem}
.paid-full{margin-top:14px;font-weight:600;color:var(--olive)}
section.block{margin-top:18px}
section.block h2{font-size:1.25rem;color:var(--olive-dark);margin-bottom:12px}
.day{padding:12px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day h3{font-size:1rem;font-family:var(--body);font-weight:600}
.day p{margin:2px 0 0;color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
ul.plain li:first-child{border-top:0}
.contact{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.foot{text-align:center;color:var(--muted);font-size:.85rem;margin-top:26px}
</style>
</head>
<body>
<main>
  <div class="brand"><i></i> Fruitty’s Travel &amp; Adventures</div>

  <!-- 1. Find my trip -->
  <div id="lookup" class="card lookup">
    <h1>Find your trip</h1>
    <p>Enter the trip code and email address I sent you.</p>
    <form id="form" autocomplete="off">
      <label for="code">Trip code</label>
      <input id="code" name="code" required placeholder="e.g. OCHO-7K3Q">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">
      <button class="btn" type="submit">Show my trip</button>
      <div id="error" class="error hidden" role="alert"></div>
    </form>
  </div>

  <!-- 2. Trip details -->
  <div id="trip" class="hidden"></div>

  <p class="foot">Questions? Message me and I’ll sort it out.</p>
</main>

<script>
/* =====================================================================
   YOUR CLIENTS – edit only this list.
   To add a client: copy one block, change every value, add a comma after the
   closing brace of the block above.

   IMPORTANT: this page is a simple private lookup, not a secure login.
   Anyone who views the page source can read this list. So NEVER put passport
   numbers, ID numbers, birth dates or card details here. Itinerary, amount
   owed and payment link only.

   - code:    make it long and random (e.g. OCHO-7K3Q), different for each client
   - total / payments: use the same currency as "currency"
   - payLink: the client's own Fygaro invoice link
   ===================================================================== */
var WHATSAPP = "18767973938";            // your WhatsApp number: country code + number, no + or spaces
var CONTACT_EMAIL = "fruittystravelsandadventures@gmail.com";   // your email

var CLIENTS = [
  {
    code: "OCHO-7K3Q",
    email: "sample.client@example.com",
    name: "Sample Client",
    trip: "Ocho Rios Escape",
    dates: "Sat 14 Nov – Sun 15 Nov 2026",
    travellers: "2 adults",
    currency: "USD",
    total: 420,
    payments: [
      { date: "2026-10-10", note: "Deposit", amount: 150 }
    ],
    dueDate: "2026-11-07",
    payLink: "https://fygaro.com/",      // replace with this client's Fygaro invoice link
    itinerary: [
      { day: "Saturday", text: "Pickup at 8:00 am. Dunn’s River Falls, lunch in Ocho Rios, horseback ride at sunset." },
      { day: "Sunday",   text: "Beach morning, souvenir stop, drop-off by 4:00 pm." }
    ],
    included: ["Private van", "Horseback ride", "Welcome kit", "Van decoration"]
  }
];
/* ===================================================================== */

var $ = function(id){ return document.getElementById(id); };

function money(n, cur){
  try { return new Intl.NumberFormat("en-US",{style:"currency",currency:cur}).format(n); }
  catch(e){ return cur + " " + n.toFixed(2); }
}
function niceDate(iso){
  var d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function showTrip(c){
  var paid = c.payments.reduce(function(s,p){ return s + p.amount; }, 0);
  var balance = Math.max(0, c.total - paid);
  var pct = c.total > 0 ? Math.min(100, Math.round(paid / c.total * 100)) : 0;
  var root = $("trip");
  root.textContent = "";

  var pass = el("div","pass");
  var top = el("div","pass-top");
  top.appendChild(el("p","hello","Hi " + c.name.split(" ")[0] + ", here’s your trip"));
  top.appendChild(el("h1",null,c.trip));
  var meta = el("div","meta");
  [["Dates",c.dates],["Travellers",c.travellers]].forEach(function(m){
    var s = el("span"); s.appendChild(document.createTextNode(m[0] + ": ")); s.appendChild(el("b",null,m[1])); meta.appendChild(s);
  });
  top.appendChild(meta);
  pass.appendChild(top);
  pass.appendChild(el("div","tear"));

  var stub = el("div","stub");
  var row = el("div","bal-row");
  var left = el("div");
  left.appendChild(el("div","label","Balance to pay"));
  left.appendChild(el("div","amount",money(balance,c.currency)));
  row.appendChild(left);
  var right = el("div","small", money(paid,c.currency) + " paid of " + money(c.total,c.currency));
  row.appendChild(right);
  stub.appendChild(row);
  var bar = el("div","bar"); var fill = el("span"); fill.style.width = pct + "%"; bar.appendChild(fill);
  bar.setAttribute("role","img"); bar.setAttribute("aria-label", pct + " percent paid");
  stub.appendChild(bar);
  if(balance > 0){
    if(c.dueDate) stub.appendChild(el("div","small","Please pay by " + niceDate(c.dueDate)));
    var a = el("a","btn pay","Pay " + money(balance,c.currency) + " now");
    a.href = c.payLink; a.target = "_blank"; a.rel = "noopener";
    stub.appendChild(a);
    stub.appendChild(el("div","small","You’ll be taken to a secure Fygaro payment page."));
  } else {
    stub.appendChild(el("div","paid-full","Paid in full. Thank you!"));
  }
  pass.appendChild(stub);
  root.appendChild(pass);

  var itin = el("section","block card"); itin.appendChild(el("h2",null,"Your plan"));
  c.itinerary.forEach(function(d){
    var day = el("div","day"); day.appendChild(el("h3",null,d.day)); day.appendChild(el("p",null,d.text)); itin.appendChild(day);
  });
  root.appendChild(itin);

  if(c.included && c.included.length){
    var inc = el("section","block card"); inc.appendChild(el("h2",null,"What’s included"));
    var ul = el("ul","plain"); c.included.forEach(function(i){ ul.appendChild(el("li",null,i)); }); inc.appendChild(ul);
    root.appendChild(inc);
  }

  var pay = el("section","block card"); pay.appendChild(el("h2",null,"Payments received"));
  if(c.payments.length){
    var pl = el("ul","plain");
    c.payments.forEach(function(p){
      var li = el("li"); li.appendChild(el("span",null,niceDate(p.date) + " – " + p.note)); li.appendChild(el("b",null,money(p.amount,c.currency))); pl.appendChild(li);
    });
    pay.appendChild(pl);
  } else { pay.appendChild(el("p","small","No payments yet.")); }
  root.appendChild(pay);

  var ct = el("section","block card"); ct.appendChild(el("h2",null,"Need to change something?"));
  var cc = el("div","contact");
  var wa = el("a","btn ghost","Message on WhatsApp"); wa.href = "https://wa.me/" + WHATSAPP; wa.target = "_blank"; wa.rel = "noopener";
  var em = el("a","btn ghost","Email me"); em.href = "mailto:" + CONTACT_EMAIL;
  cc.appendChild(wa); cc.appendChild(em); ct.appendChild(cc);
  root.appendChild(ct);

  $("lookup").classList.add("hidden");
  root.classList.remove("hidden");
  window.scrollTo(0,0);
}

function find(code, email){
  code = code.trim().toUpperCase(); email = email.trim().toLowerCase();
  for(var i=0;i<CLIENTS.length;i++){
    if(CLIENTS[i].code.toUpperCase() === code && CLIENTS[i].email.toLowerCase() === email) return CLIENTS[i];
  }
  return null;
}

$("form").addEventListener("submit", function(e){
  e.preventDefault();
  var c = find($("code").value, $("email").value);
  var err = $("error");
  if(c){ err.classList.add("hidden"); showTrip(c); }
  else { err.textContent = "We couldn’t find that trip. Check the code and the email address I have for you, then try again."; err.classList.remove("hidden"); }
});

/* Optional: a link like portal.html?code=OCHO-7K3Q fills in the code for the client */
var qs = new URLSearchParams(location.search);
if(qs.get("code")) $("code").value = qs.get("code");
</script>
</body>
</html>
